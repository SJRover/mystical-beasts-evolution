<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Foes</title>
<style>
  body { margin: 0; background: #2a2f3a; font: 11px system-ui, sans-serif; color: #dde; }
  #grid { display: grid; grid-template-columns: repeat(var(--cols, 10), 1fr); gap: 2px; padding: 4px; }
  .cell { background: #46505e; border-radius: 6px; text-align: center; padding-bottom: 3px; }
  .cell.w1 { background: #6a7a6a; } .cell.w2 { background: #7a8aa0; } .cell.w3 { background: #5a4a3a; }
  canvas { display: block; margin: 0 auto; }
</style>
</head>
<body>
<div id="grid"></div>

<script src="../beasts.js"></script>
<script src="../battle_data.js"></script>
<script src="../enemies.js"></script>
<script>
  // tools/foes.html?world=1&size=110&pose=walk|atk|heavy|hurt|die&cols=10
  const q = new URLSearchParams(location.search);
  const world = Number(q.get('world') || 0);
  const size = Number(q.get('size') || 110);
  const poseKind = q.get('pose') || 'walk';
  document.documentElement.style.setProperty('--cols', q.get('cols') || 10);
  const list = BATTLE_DATA.ENEMY_LIST.filter((e) => !world || e.world === world);
  const cells = list.map((e) => {
    const d = document.createElement('div');
    d.className = 'cell w' + e.world;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    d.appendChild(c);
    d.appendChild(document.createTextNode(`${e.name} (${e.role}) ${BATTLE_DATA.difficulty(e.id)}★`));
    document.getElementById('grid').appendChild(d);
    return { e, c };
  });
  let t0 = performance.now();
  window.frameAt = (t) => {
    for (const { e, c } of cells) {
      const ctx = c.getContext('2d');
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, size, size);
      ctx.translate(size / 2, size * 0.9);
      const big = e.look.size || 1;
      const k = (t % 1.2) / 1.2;
      const pose = { t, walk: (t * 1.4) % 1, atk: -1, heavy: false, hurt: 0, dying: 0, seed: 3, capture: false };
      if (poseKind === 'atk') pose.atk = Number(q.get('k') || k);
      if (poseKind === 'heavy') { pose.atk = Number(q.get('k') || k); pose.heavy = true; }
      if (poseKind === 'hurt') pose.hurt = 0.8;
      if (poseKind === 'die') pose.dying = Number(q.get('k') || 0.4);
      ENEMY_ART.draw(ctx, e.id, pose, (size * 0.55) / Math.max(1, big * 0.8));
    }
  };
  const loop = (now) => { window.frameAt((now - t0) / 1000); if (!q.get('still')) requestAnimationFrame(loop); };
  if (q.get('still')) window.frameAt(Number(q.get('t') || 0.3)); else requestAnimationFrame(loop);
</script>
</body>
</html>
