<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>App Store key art</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; max-width: 100vw; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../beasts.js"></script>
<script src="../art.js"></script>
<script src="../biomes.js"></script>
<script>
// App Store creative assets for 1.3 (product page header, search results, universal), drawn from the
// game's own art: `store_art.html?kind=header|search|universal`. Apple's sizes and art safe areas:
// the key beasts stay inside the safe area; the meadow and the crowd fill the rest.
const KINDS = {
  header: { w: 3840, h: 1646, safe: [1097, 493, 1646, 661] },
  search: { w: 3840, h: 2560, safe: [836, 765, 2168, 1030] },
  universal: { w: 5244, h: 2950, safe: [1921, 660, 1402, 962] },
};
const kind = new URLSearchParams(location.search).get('kind') || 'header';
const K = KINDS[kind];
const W = K.w, H = K.h;
const [sx, sy, sw, sh] = K.safe;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');

function rng(seed) { let a = seed; return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const R = rng(1306);

function load(svg, px) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace('width="100%" height="100%"', `width="${px}" height="${px}"`));
  });
}
function glow(cx, cy, r, col, a) {
  const g = c.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.save(); c.globalAlpha = a; c.fillStyle = g; c.fillRect(cx - r, cy - r, r * 2, r * 2); c.restore();
}
function rays(cx, cy, len, n, col, col2, alpha) {
  const g = c.createRadialGradient(cx, cy, 0, cx, cy, len);
  g.addColorStop(0, col2); g.addColorStop(0.35, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.save(); c.globalAlpha = alpha; c.fillStyle = g;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 - Math.PI / 2, w = i % 2 ? 0.045 : 0.08;
    c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, len * (i % 2 ? 0.85 : 1), a - w, a + w); c.closePath(); c.fill();
  }
  c.restore();
}
function sparkle(x, y, r, col) {
  c.save(); c.fillStyle = col; c.shadowColor = col; c.shadowBlur = r * 1.6;
  c.beginPath(); c.moveTo(x, y - r); c.quadraticCurveTo(x, y, x + r, y); c.quadraticCurveTo(x, y, x, y + r);
  c.quadraticCurveTo(x, y, x - r, y); c.quadraticCurveTo(x, y, x, y - r); c.fill(); c.restore();
}
/** One beast standing at (x, y = its feet), `size` pixels tall, glowing in its rarity's colour. */
async function beast(id, x, y, size, { ev = false, flip = false, aura = false } = {}) {
  const px = Math.round(size * 1.25);
  const col = ART.glowColour(id, ev, false);
  const cy = y - size * 0.46;
  if (aura && col) { glow(x, cy, size * 0.95, col, 0.55); }
  const img = await load(ART.beast(id, { evolved: ev, noGround: true, pad: true }), px);
  c.save();
  c.translate(x, cy);
  if (flip) c.scale(-1, 1);
  c.save(); c.globalAlpha = 0.32; c.fillStyle = '#000'; c.filter = `blur(${Math.max(2, size * 0.02)}px)`;
  c.beginPath(); c.ellipse(0, size * 0.43, size * 0.27, size * 0.06, 0, 0, Math.PI * 2); c.fill(); c.restore();
  if (col) { c.shadowColor = col; c.shadowBlur = px * 0.06; c.drawImage(img, -px / 2, -px / 2, px, px); }
  c.shadowBlur = px * 0.02; c.shadowColor = 'rgba(255,255,255,0.9)';
  c.drawImage(img, -px / 2, -px / 2, px, px);
  c.shadowBlur = 0; c.shadowColor = 'rgba(0,0,0,0)';
  c.drawImage(img, -px / 2, -px / 2, px, px);
  c.restore();
}
function coin(x, y, r) {
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => { c.save(); c.shadowColor = 'rgba(255,210,80,0.9)'; c.shadowBlur = r * 0.6; c.drawImage(img, x - r, y - r, r * 2, r * 2); c.restore(); res(); };
    img.onerror = res;
    img.src = ART.coin(R() < 0.3);
  });
}

async function draw() {
  // The Forest Meadow, painted by the game for this canvas, softened so the beasts stand out.
  const def = BIOMES.PRIME.find((b) => b.name === 'Forest Meadow');
  const art = BIOMES.paint(def, W, H * 1.12, 1);
  c.save(); c.filter = `blur(${Math.round(H * 0.0035)}px) saturate(0.85)`; c.drawImage(art, 0, -H * 0.12, W, H * 1.12); c.restore();
  const v = c.createRadialGradient(W / 2, sy + sh / 2, Math.min(W, H) * 0.25, W / 2, sy + sh / 2, Math.max(W, H) * 0.7);
  v.addColorStop(0, 'rgba(10,8,40,0.08)'); v.addColorStop(1, 'rgba(10,8,40,0.55)');
  c.fillStyle = v; c.fillRect(0, 0, W, H);

  // The crowd: beasts of every tier wandering the meadow around the edges (outside the safe area).
  const crowd = ['sparky', 'ember', 'dewdrop', 'cinder', 'zephyr', 'pyreling', 'aqualet', 'terrapin', 'ignis', 'torrent', 'sylph', 'magmadon', 'hydradon', 'aven', 'frostbite', 'geon', 'nebulon', 'aqualion', 'aeris', 'chronos', 'astral', 'phoenix', 'siren', 'leviathan', 'cosmos', 'genesis', 'titan', 'eclipse', 'supernova', 'wyrm'];
  const base = Math.min(W, H) * 0.15;
  const spots = [];
  const cols = Math.round(W / (base * 1.7)), rows = Math.round(H / (base * 1.45));
  for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
    const x = ((q + 0.5 + (R() - 0.5) * 0.7) / cols) * W, y = ((r + 0.75 + (R() - 0.5) * 0.4) / rows) * H;
    const pad = base * 0.9;
    if (x > sx - pad && x < sx + sw + pad && y > sy - pad * 0.5 && y < sy + sh + base * 1.2) continue;
    if (y < base * 1.15 || x < base * 0.5 || x > W - base * 0.5) continue;
    if (R() < 0.3) continue;
    spots.push([x, y]);
  }
  spots.sort((a, b) => a[1] - b[1]);
  const items = [];
  spots.forEach(([x, y], i) => {
    if (R() < 0.14) items.push(['coin', x, y]);
    else items.push(['beast', x, y, crowd[Math.floor(R() * crowd.length)], base * (0.8 + R() * 0.35), R() < 0.12, R() < 0.5]);
  });
  for (const it of items) {
    if (it[0] === 'coin') await coin(it[1], it[2] - base * 0.2, base * 0.2);
    else await beast(it[3], it[1], it[2], it[4], { ev: it[5], flip: it[6] });
  }

  // The heroes in the safe area: a Legendary Aurelion in a golden burst, flanked by two Godly
  // sovereigns, and the starter Sparkys merging at their feet.
  const cx = sx + sw / 2, cyy = sy + sh * 0.5;
  glow(cx, cyy, sh * 1.1, '#ff9a1f', 0.65);
  rays(cx, cyy, Math.max(sw, sh) * 0.95, 18, '#ffb21a', '#fff1b0', 0.42);
  glow(cx, cyy, sh * 0.55, '#fff1b0', 0.5);
  const big = sh * 0.98;
  await beast('abyssus', sx + sw * 0.17, sy + sh * 0.97, big * 0.72, { aura: true });
  await beast('solaris', sx + sw * 0.83, sy + sh * 0.97, big * 0.72, { aura: true, flip: true });
  await beast('aurelion', cx, sy + sh * 1.0, big, { aura: true });
  for (const [x, y, r] of [[0.06, 0.12, 0.05], [0.94, 0.16, 0.04], [0.3, 0.02, 0.03], [0.7, 0.04, 0.035]]) sparkle(sx + sw * x, sy + sh * y, sh * r, '#ffffff');
}

window.ART_READY = draw().then(() => 'ok');
</script>
</body>
</html>
