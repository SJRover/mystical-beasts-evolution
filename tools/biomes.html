<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Biome gallery</title>
<style>
  body { background: #111; color: #ddd; font: 11px sans-serif; margin: 0; padding: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .cell { text-align: center; }
  canvas { width: 140px; height: 300px; display: block; border-radius: 6px; }
</style>
</head>
<body>
<div class="row" id="g"></div>
<script>window.state = { inBeastHub: false, currentSolarSystem: 'prime', prestigeLevel: 0 };</script>
<script src="../biomes.js"></script>
<script>
  const sys = new URLSearchParams(location.search).get('sys') || 'prime';
  const list = sys === 'low' ? BIOMES.LOW : sys === 'hub' ? [BIOMES.HUB] : BIOMES.PRIME;
  for (const B of list) {
    const cv = BIOMES.paint(B, 412, 892, 1);
    const d = document.createElement('div');
    d.className = 'cell';
    d.appendChild(cv);
    d.appendChild(document.createTextNode(B.name));
    document.getElementById('g').appendChild(d);
  }
</script>
</body>
</html>
